# Travelstream self-hosted stack: one file, four services.
#
#   backend  - single Plone instance, plain filestorage + blobstorage
#              (no ZEO/relstorage: only this process touches the ZODB;
#              the worker talks restapi only)
#   web      - nginx serving the PWA statics and proxying the REST API
#              under the same origin (no CORS in the browser)
#   worker   - ffmpeg media worker (poster frame + faststart remux)
#   backup   - scheduled repozo + blobstorage snapshots
#
# First run:
#   cp .env.example .env   # set passwords
#   docker compose up -d
#   # the image auto-creates the "Plone" site (TYPE=classic) and installs
#   # the Travelstream add-on via PROFILES; then create the worker user
#   # (WORKER_USER) in Plone with Editor rights on /Plone/trips.

services:
  backend:
    image: docker.io/plone/plone-backend:6.1.5
    restart: unless-stopped
    environment:
      SITE: Plone
      # Classic-UI site, NOT the default Volto distribution: the Volto
      # profile removes Folder from the addable types, which breaks the
      # add-on's /Plone/trips container (and this stack serves its own PWA,
      # not Volto).
      TYPE: classic
      # Install our add-on from the mounted source checkout
      DEVELOP: /app/src/collective.travelstream
      PROFILES: collective.travelstream:default
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../backend/collective.travelstream:/app/src/collective.travelstream:ro
      - filestorage:/data/filestorage
      - blobstorage:/data/blobstorage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    # Write the runtime DNS resolver nginx needs for per-request backend
    # re-resolution (see nginx.conf); the address is runtime-specific
    # (Docker 127.0.0.11, podman: network gateway), so take the first
    # nameserver from the container's resolv.conf.
    command: >
      /bin/sh -c "echo \"resolver $$(awk '/^nameserver/{print $$2; exit}' /etc/resolv.conf) valid=10s ipv6=off;\"
      > /etc/nginx/conf.d/00-resolver.conf
      && exec nginx -g 'daemon off;'"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the parent dir, not build/ itself: the SvelteKit adapter
      # deletes and recreates build/ on every rebuild, which would leave a
      # bind mount on build/ pointing at the deleted directory (403s until
      # the container restarts). nginx's root is html/build.
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  worker:
    build: ../worker
    restart: unless-stopped
    environment:
      PLONE_URL: http://backend:8080/Plone
      PLONE_USER: ${WORKER_USER:?set WORKER_USER in .env}
      PLONE_PASSWORD: ${WORKER_PASSWORD:?set WORKER_PASSWORD in .env}
      POLL_SECONDS: "15"
    depends_on:
      - backend

  backup:
    image: docker.io/plone/plone-backend:6.1.5
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      KEEP_DAYS: "${BACKUP_KEEP_DAYS:-30}"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - filestorage:/data/filestorage:ro
      - blobstorage:/data/blobstorage:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  filestorage:
  blobstorage:
