# PWA statics + same-origin REST proxy + Classic UI under /cms.

server {
    listen 80;
    server_name _;

    # Re-resolve the backend on every request: a static upstream{} pins
    # the container IP once at nginx startup, so every backend container
    # recreate left the proxy 502ing (login and the whole API down) until
    # the web container was restarted too. Requires a runtime resolver;
    # its address differs per runtime (Docker 127.0.0.11, podman gateway),
    # so the compose command generates conf.d/00-resolver.conf from the
    # container's own resolv.conf at startup.
    set $plone http://backend:8080;

    # The mount is the frontend checkout; the static site lives in build/
    # (see the compose file for why the mount is one level up).
    root /usr/share/nginx/html/build;
    index index.html;

    client_max_body_size 2G;

    # REST API under the same origin (plone.rest ++api++ traversal).
    location ~ ^/\+\+api\+\+($|/.*) {
        # $http_host keeps the browser's port (e.g. powerman:8085); $host
        # drops it, which made Plone generate port-80 URLs that fail CORS.
        rewrite ^/(\+\+api\+\+\/?)+($|/.*) /VirtualHostBase/http/$http_host/Plone/++api++/VirtualHostRoot/$2 break;
        proxy_pass $plone;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;   # stream TUS uploads
    }

    # Classic UI (curation fallback + the public blog) under /cms.
    location /cms {
        rewrite ^/cms($|/.*) /VirtualHostBase/http/$http_host/Plone/VirtualHostRoot/_vh_cms$1 break;
        proxy_pass $plone;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # The PWA (SvelteKit adapter-static SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
