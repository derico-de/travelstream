# PWA statics + same-origin REST proxy + Classic UI under /cms.

upstream plone {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2G;

    # REST API under the same origin (plone.rest ++api++ traversal).
    location ~ ^/\+\+api\+\+($|/.*) {
        rewrite ^/(\+\+api\+\+\/?)+($|/.*) /VirtualHostBase/http/$host/Plone/++api++/VirtualHostRoot/$2 break;
        proxy_pass http://plone;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;   # stream TUS uploads
    }

    # Classic UI (curation fallback + the public blog) under /cms.
    location /cms {
        rewrite ^/cms($|/.*) /VirtualHostBase/http/$host/Plone/VirtualHostRoot/_vh_cms$1 break;
        proxy_pass http://plone;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # The PWA (SvelteKit adapter-static SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
